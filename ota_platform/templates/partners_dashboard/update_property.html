{% extends "partners_dashboard/base_partners.html" %}

{% block page_title %}Update Property{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="h4 mb-1">Update Property</h2>
            <p class="text-muted mb-0">Update listing details for {{ property.name }}.</p>
        </div>
        <a href="{% url 'partners_dashboard:manage_properties' %}" class="btn btn-outline-secondary">Back to properties</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Property name</label>
                        <input type="text" class="form-control" name="name" value="{{ property.name }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Star rating</label>
                        <select class="form-select" name="star_rating">
                            {% for i in '12345' %}
                                <option value="{{ i }}" {% if property.star_rating == i|add:'0' %}selected{% endif %}>{{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Price per night</label>
                        <div class="input-group">
                            <input type="number" step="0.01" class="form-control" name="price_per_night_0" value="{{ property.price_per_night.amount }}" required>
                            <span class="input-group-text">{{ property.price_per_night.currency }}</span>
                        </div>
                        <input type="hidden" name="price_per_night_1" value="{{ property.price_per_night.currency }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4" required>{{ property.description }}</textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="address" rows="2" required>{{ property.address }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" name="is_available" {% if property.is_available %}checked{% endif %}>
                            <label class="form-check-label">Available for bookings</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" name="is_featured" {% if property.is_featured %}checked{% endif %}>
                            <label class="form-check-label">Featured listing</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                    <a href="{% url 'partners_dashboard:manage_properties' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
