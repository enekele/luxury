{% extends "partners_dashboard/base_partners.html" %}

{% block page_title %}Update Car Rental{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="h4 mb-1">Update Car Rental</h2>
            <p class="text-muted mb-0">Update {{ property.car_model }} details.</p>
        </div>
        <a href="{% url 'partners_dashboard:manage_properties' %}" class="btn btn-outline-secondary">Back to properties</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Pickup location</label>
                        <input type="text" class="form-control" name="pickup_location" value="{{ property.pickup_location }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Price per day</label>
                        <div class="input-group">
                            <input type="number" step="0.01" class="form-control" name="price_per_day_0" value="{{ property.price_per_day.amount }}" required>
                            <span class="input-group-text">{{ property.price_per_day.currency }}</span>
                        </div>
                        <input type="hidden" name="price_per_day_1" value="{{ property.price_per_day.currency }}">
                    </div>
                    <div class="col-md-3">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" name="is_available" {% if property.is_available %}checked{% endif %}>
                            <label class="form-check-label">Available</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                    <a href="{% url 'partners_dashboard:manage_properties' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
