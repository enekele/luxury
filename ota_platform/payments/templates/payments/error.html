{% extends 'base.html' %}

{% block title %}Payment Error - {{ site_settings.site_name|default:"TravelHub" }}{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="alert alert-danger">
                <h4 class="alert-heading">Payment Error</h4>
                <p>{{ message }}</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{% url 'subscription_packages' %}" class="btn btn-primary">Return to subscriptions</a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">Back to home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
